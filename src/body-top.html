<body>
<div class="wrap">
  <header class="top">
    <div class="bar1">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--brand)"/><path d="M9 22V10h8M9 16h6M9 22h8" stroke="var(--brand-ink)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="21" r="2.4" fill="var(--amber)"/></svg>
      <h1 id="h1">Времена</h1>
      <span class="pill" id="topStat" title="Верных ответов сегодня"><svg viewBox="0 0 24 24" fill="none" stroke="var(--plus)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span id="topToday">0</span></span>
    </div>
    <div class="sec" role="group" aria-label="Раздел">
      <button data-sec="tense" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Времена</button>
      <button data-sec="art" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19l4-12 4 12M5.5 15h5M15 9h5M17.5 9v10"/></svg>Артикли</button>
      <button data-sec="words" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>Слова</button>
    </div>
    <div class="lbar" id="lbar" hidden><div class="lsegs" id="lsegs"></div><span class="lcombo" id="lcombo" hidden>×2</span><span class="lxp" id="lxp">0 XP</span><button id="lend" aria-label="Завершить урок" title="Завершить урок">✕</button></div>
  </header>
  <section class="view" id="v-home" hidden>
    <div class="hero" id="hHero"></div>
    <div class="hstats" id="hStats"></div>
    <h2>Программа дня</h2>
    <div class="card hprog" id="hProg"></div>
    <h2>Задания на сегодня</h2>
    <div class="card" id="hQuests"></div>
    <h2>Маршрут: 12 времён</h2>
    <div class="card" id="hMap"></div>
    <h2>Достижения <small id="hAchN" class="mk"></small></h2>
    <div class="achs" id="hAch"></div>
    <p class="note">Никаких штрафов: урок можно закончить в любой момент, весь прогресс сохраняется сразу.</p>
  </section>
